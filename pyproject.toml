[project]
name = "kakeibo-app"
version = "0.1.0"
description = "シンプルな家計簿デスクトップアプリケーション（Tkinter）"
requires-python = ">=3.14, <3.15"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
